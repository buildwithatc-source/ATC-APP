name: Release

# Build and publish installers to GitHub Releases when a version tag is pushed.
# Cut a release with:  npm version patch && git push --follow-tags
#
# The `build` matrix produces the Windows/Mac desktop installers and the
# `android` job produces a sideloadable APK for the tablet — each WITHOUT
# publishing, uploading its files as CI artifacts. A single final `publish` job
# then creates the GitHub Release with everything at once. This avoids the
# multi-job clobbering you get when jobs publish to the same release concurrently.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: '--win'
          - os: macos-latest
            target: '--mac'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env (Supabase build-time config)
        shell: bash
        # These are the PUBLIC client credentials (project URL + publishable/anon
        # key). They ship inside every installer already and are safe to expose
        # while RLS is on. Hardcoded here so a missing repo secret can't silently
        # ship an app with empty config (which blank-screens on launch). A repo
        # secret, if set, still overrides.
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://wsupsihybxzlmlezvape.supabase.co' }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_oFltZ1ncn_AbGnxJqWwHWQ_1k1dNFYW' }}" >> .env

      - name: Build renderer/main/preload
        run: npm run build

      - name: Build installer (no publish)
        run: npx electron-builder ${{ matrix.target }} --publish never --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          # Single-level (release/<version>/*) so we grab the installers only,
          # not the raw exe inside win-unpacked/.
          path: |
            release/*/*.exe
            release/*/*.exe.blockmap
            release/*/*.dmg
            release/*/*.dmg.blockmap
            release/*/*.zip
            release/*/*.zip.blockmap
            release/*/latest*.yml

  android:
    # Builds a sideloadable debug APK for the tablet (Honor Pad 10) and uploads
    # it as an artifact so the publish job attaches it to the same Release.
    # Debug build = no signing keystore needed; installable via "unknown apps".
    #
    # If this job fails (e.g. a flaky action download), the run shows red but the
    # `publish` job still ships the desktop installers — it uses `if: always()`
    # and only requires `build` to have succeeded (see below). The APK is simply
    # absent from that release; re-cut to try again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Capacitor CLI 8 requires Node >= 22 (the desktop build jobs stay on 20).
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          # Capacitor 8's Android libraries compile with source level 21.
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install SDK packages (API 36)
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Create .env (Supabase build-time config)
        # Same public client credentials the desktop build uses (see build job).
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://wsupsihybxzlmlezvape.supabase.co' }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_oFltZ1ncn_AbGnxJqWwHWQ_1k1dNFYW' }}" >> .env

      - name: Build web bundle
        run: npm run build:web

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name APK by version
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-out/ATC-Ledger-${{ github.ref_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          if-no-files-found: error
          path: apk-out/*.apk

  publish:
    needs: [build, android]
    # Run once build+android have finished. `always()` means a failed/skipped
    # android job (flaky APK build) does NOT block the desktop release; we only
    # require the desktop installers (`build`) to have succeeded. download-artifact
    # then attaches whatever artifacts exist — with the APK if it built.
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: Create GitHub Release with all assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
