name: Release

# Build and publish installers to GitHub Releases when a version tag is pushed.
# Cut a release with:  npm version patch && git push --follow-tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      # Publish one platform at a time — concurrent publishes to the same
      # GitHub Release can race and drop assets (e.g. latest.yml / the exe).
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            target: '--win'
          - os: macos-latest
            target: '--mac'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env (Supabase build-time config)
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build renderer/main/preload
        run: npm run build

      - name: Build & publish installer
        run: npx electron-builder ${{ matrix.target }} --publish always --config electron-builder.yml
        env:
          # electron-builder uploads to GitHub Releases with this token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Both platforms aggregate their assets into one DRAFT release; publish it once
  # everything is uploaded so the release is always complete.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
