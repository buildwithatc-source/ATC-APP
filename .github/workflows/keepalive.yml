name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days of no activity, which forces a
# manual "Restore" and breaks the app until it spins back up. This runs a tiny
# read-only query against the database on a schedule so the project always sees
# recent activity and never idles out.
#
# It uses the PUBLIC publishable key (the same one already shipped inside the
# app) and only reads — RLS returns an empty result for the anon role, but the
# request still reaches Postgres, which is what counts as activity.

on:
  schedule:
    # Mondays and Thursdays at 06:00 UTC → at most ~3–4 days between pings,
    # comfortably under Supabase's 7-day idle window.
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to keep the project awake
        env:
          SUPABASE_URL: https://wsupsihybxzlmlezvape.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_oFltZ1ncn_AbGnxJqWwHWQ_1k1dNFYW
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/payment_methods?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded: HTTP $code"
          # Any 2xx means the database served the query (RLS-empty 200 included).
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Unexpected status — project may be paused or unreachable."
            exit 1
          fi
          echo "Project is awake."
