version: 2
updates:
  # App dependencies. Grouped minor/patch PRs keep the noise down; majors come
  # through on their own so they can be reviewed for breaking changes.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Keeps the SHA-pinned GitHub Actions in .github/workflows current. Dependabot
  # understands `uses: owner/action@<sha> # vX` pins and bumps the SHA + comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
