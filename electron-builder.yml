appId: com.buildwithatc.invoicer
productName: ATC Ledger
copyright: Copyright © 2026 Build With ATC

directories:
  buildResources: build
  output: release/${version}

# Only ship the compiled output + package manifest.
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!electron-builder.yml'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tailwind.config.js,postcss.config.js}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,README.md}'

asarUnpack:
  - resources/**

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png # electron-builder converts to .ico for app + installer

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ATC Ledger

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.business
  icon: build/icon.png # electron-builder converts to .icns

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}

# Auto-update source (GitHub Releases).
# releaseType: draft -> every platform job aggregates its assets into ONE draft
# release (reliable for multi-platform CI). A final workflow job publishes the
# draft. (With releaseType: release, a second job can clear the first's assets.)
publish:
  provider: github
  owner: buildwithatc-source
  repo: ATC-APP
  releaseType: draft
